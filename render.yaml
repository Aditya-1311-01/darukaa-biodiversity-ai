services:
  - type: web
    name: darukaa-biodiversity-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m knowledge.ingest
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CHROMA_DIR
        value: /tmp/chroma
      - key: PYTHON_VERSION
        value: 3.11.9