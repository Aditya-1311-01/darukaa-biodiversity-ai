name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic python-dotenv pytest ruff httpx
      - name: Lint
        run: ruff check app knowledge eval tests
      - name: Test deterministic layer
        run: pytest -q
      - name: Import check for the API
        run: python -c "from app.main import app; print('routes:', len(app.routes))"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t darukaa-biodiversity:ci .
